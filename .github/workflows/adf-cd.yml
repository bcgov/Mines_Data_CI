name: ADF CD — Deploy ARM Templates

# ─────────────────────────────────────────────────────────────────────────────
# Triggered automatically when a PR into dev / test / main is merged,
# or manually via workflow_dispatch.
#
# Deployment order:  Dev → Test → Prod
# Each environment runs:
#   1. PrePostDeploymentScript.ps1  (predeployment=true)  — stop triggers
#   2. GlobalParametersUpdateScript.ps1                   — update global params
#   3. ARM template deployment                            — deploy resources
#   4. PrePostDeploymentScript.ps1  (predeployment=false) — delete removed
#                                                           resources + start triggers
#
# Prod additionally creates Action Group & Alerts via CreateActionGroupAndAlerts.ps1
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [closed]
    branches:
      - "dev"
      - "test"
      - "main"
    paths:
      - "ADF/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options: [dev, test, prod]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: adf-cd-${{ github.ref }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Required repository variables (Settings → Variables → Actions):
#   ARM_SUBSCRIPTION_ID    Azure subscription ID
#   ARM_TENANT_ID          Azure AD tenant ID
#   ARM_CLIENT_ID          Service principal client ID
#
# Required repository secrets (Settings → Secrets → Actions):
#   ARM_CLIENT_SECRET      Service principal client secret
#
# Hardcoded resource config (edit here to change environments):
#   Resource group : mines-fabric-rg02
#   Data factory   : mines-fabric-adf01
#   Region         : canadacentral
# ─────────────────────────────────────────────────────────────────────────────
env:
  REGION:          "canadacentral"
  NOTIFICATION_DL: "sebastian.hansen@gov.bc.ca"
  ASSIGNEE:        "Sebastian Hansen"
  # ADF resource config — hardcoded, matches CI pipeline
  ADF_RG:          "mines-fabric-rg02"
  ADF_NAME:        "mines-fabric-adf01"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 0. Resolve deployment context
  # ═══════════════════════════════════════════════════════════════════════════
  resolve-context:
    name: "0. Resolve Deployment Context"
    runs-on: ubuntu-latest
    environment: dev
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    outputs:
      deploy_dev:  ${{ steps.ctx.outputs.deploy_dev }}
      deploy_test: ${{ steps.ctx.outputs.deploy_test }}
      deploy_prod: ${{ steps.ctx.outputs.deploy_prod }}

    steps:
      - name: Resolve context
        id: ctx
        run: |
          DEPLOY_DEV=false
          DEPLOY_TEST=false
          DEPLOY_PROD=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ inputs.environment }}"
            [[ "$ENV" == "dev"  ]] && DEPLOY_DEV=true
            [[ "$ENV" == "test" ]] && DEPLOY_TEST=true
            [[ "$ENV" == "prod" ]] && DEPLOY_PROD=true
          else
            BASE="${{ github.event.pull_request.base.ref }}"
            [[ "$BASE" == "dev"  ]] && DEPLOY_DEV=true
            [[ "$BASE" == "test" ]] && DEPLOY_TEST=true
            [[ "$BASE" == "main" ]] && DEPLOY_PROD=true
          fi

          echo "deploy_dev=$DEPLOY_DEV"   >> "$GITHUB_OUTPUT"
          echo "deploy_test=$DEPLOY_TEST" >> "$GITHUB_OUTPUT"
          echo "deploy_prod=$DEPLOY_PROD" >> "$GITHUB_OUTPUT"

          echo "Deploy dev  : $DEPLOY_DEV"
          echo "Deploy test : $DEPLOY_TEST"
          echo "Deploy prod : $DEPLOY_PROD"

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Deploy to Dev
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-dev:
    name: "2. Deploy to Dev"
    needs: [resolve-context]
    if: needs.resolve-context.outputs.deploy_dev == 'true'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      # ARM templates committed to the repo by CI — available via checkout above.

      - name: Azure login (Dev)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId":       "${{ vars.ARM_TENANT_ID }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}"
            }

      - name: Connect Az PowerShell module
        shell: pwsh
        env:
          ARM_CLIENT_ID:     ${{ vars.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID:     ${{ vars.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          $secureSecret = ConvertTo-SecureString $env:ARM_CLIENT_SECRET -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:ARM_CLIENT_ID, $secureSecret)
          Connect-AzAccount -ServicePrincipal -Credential $credential -Tenant $env:ARM_TENANT_ID -Subscription $env:ARM_SUBSCRIPTION_ID
          Write-Host "Az PowerShell connected successfully"

      - name: Pre-deployment — Dev
        shell: pwsh
        run: |
          ./ADF/release/PrePostDeploymentScript.ps1 `
            -ArmTemplate          "./ADF/ArmTemplates/Dev/ARMTemplateForFactory.json" `
            -ArmTemplateParameters "./ADF/ArmTemplates/Dev/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -ResourceGroupName    "${{ env.ADF_RG }}" `
            -DataFactoryName      "${{ env.ADF_NAME }}" `
            -PreDeployment        $true `
            -DeleteDeployment     $false

      - name: Update global parameters — Dev
        shell: pwsh
        run: |
          ./ADF/release/GlobalParametersUpdateScript.ps1 `
            -globalParametersFilePath "./ADF/ArmTemplates/Dev/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -resourceGroupName        "${{ env.ADF_RG }}" `
            -dataFactoryName          "${{ env.ADF_NAME }}"

      - name: ARM template deployment — Dev
        uses: azure/arm-deploy@v2
        with:
          subscriptionId:    ${{ vars.ARM_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.ADF_RG }}
          region:            ${{ env.REGION }}
          template:          ./ADF/ArmTemplates/Dev/ARMTemplateForFactory.json
          parameters:        ./ADF/ArmTemplates/Dev/ARMTemplateParametersForFactory.json

      - name: Post-deployment — Dev
        shell: pwsh
        run: |
          ./ADF/release/PrePostDeploymentScript.ps1 `
            -ArmTemplate          "./ADF/ArmTemplates/Dev/ARMTemplateForFactory.json" `
            -ArmTemplateParameters "./ADF/ArmTemplates/Dev/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -ResourceGroupName    "${{ env.ADF_RG }}" `
            -DataFactoryName      "${{ env.ADF_NAME }}" `
            -PreDeployment        $false `
            -DeleteDeployment     $true

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Deploy to Test
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-test:
    name: "3. Deploy to Test"
    needs: [resolve-context, deploy-dev]
    if: |
      always() &&
      needs.resolve-context.outputs.deploy_test == 'true' ||
      (needs.resolve-context.outputs.deploy_dev == 'true' && needs.deploy-dev.result == 'success')
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: test

      # ARM templates committed to the repo by CI — available via checkout above.

      - name: Azure login (Test)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId":       "${{ vars.ARM_TENANT_ID }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}"
            }

      - name: Connect Az PowerShell module
        shell: pwsh
        env:
          ARM_CLIENT_ID:     ${{ vars.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID:     ${{ vars.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          $secureSecret = ConvertTo-SecureString $env:ARM_CLIENT_SECRET -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:ARM_CLIENT_ID, $secureSecret)
          Connect-AzAccount -ServicePrincipal -Credential $credential -Tenant $env:ARM_TENANT_ID -Subscription $env:ARM_SUBSCRIPTION_ID
          Write-Host "Az PowerShell connected successfully"

      - name: Pre-deployment — Test
        shell: pwsh
        run: |
          ./ADF/release/PrePostDeploymentScript.ps1 `
            -ArmTemplate          "./ADF/ArmTemplates/Test/ARMTemplateForFactory.json" `
            -ArmTemplateParameters "./ADF/ArmTemplates/Test/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -ResourceGroupName    "${{ env.ADF_RG }}" `
            -DataFactoryName      "${{ env.ADF_NAME }}" `
            -PreDeployment        $true `
            -DeleteDeployment     $false

      - name: Update global parameters — Test
        shell: pwsh
        run: |
          ./ADF/release/GlobalParametersUpdateScript.ps1 `
            -globalParametersFilePath "./ADF/ArmTemplates/Test/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -resourceGroupName        "${{ env.ADF_RG }}" `
            -dataFactoryName          "${{ env.ADF_NAME }}"

      - name: ARM template deployment — Test
        uses: azure/arm-deploy@v2
        with:
          subscriptionId:    ${{ vars.ARM_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.ADF_RG }}
          region:            ${{ env.REGION }}
          template:          ./ADF/ArmTemplates/Test/ARMTemplateForFactory.json
          parameters:        ./ADF/ArmTemplates/Test/ARMTemplateParametersForFactory.json

      - name: Post-deployment — Test
        shell: pwsh
        run: |
          ./ADF/release/PrePostDeploymentScript.ps1 `
            -ArmTemplate          "./ADF/ArmTemplates/Test/ARMTemplateForFactory.json" `
            -ArmTemplateParameters "./ADF/ArmTemplates/Test/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -ResourceGroupName    "${{ env.ADF_RG }}" `
            -DataFactoryName      "${{ env.ADF_NAME }}" `
            -PreDeployment        $false `
            -DeleteDeployment     $true

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-prod:
    name: "4. Deploy to Production"
    needs: [resolve-context, deploy-test]
    if: |
      always() &&
      needs.resolve-context.outputs.deploy_prod == 'true' ||
      (needs.resolve-context.outputs.deploy_test == 'true' && needs.deploy-test.result == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      # ARM templates committed to the repo by CI — available via checkout above.

      - name: Azure login (Prod)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId":       "${{ vars.ARM_TENANT_ID }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}"
            }

      - name: Connect Az PowerShell module
        shell: pwsh
        env:
          ARM_CLIENT_ID:     ${{ vars.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_TENANT_ID:     ${{ vars.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          $secureSecret = ConvertTo-SecureString $env:ARM_CLIENT_SECRET -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($env:ARM_CLIENT_ID, $secureSecret)
          Connect-AzAccount -ServicePrincipal -Credential $credential -Tenant $env:ARM_TENANT_ID -Subscription $env:ARM_SUBSCRIPTION_ID
          Write-Host "Az PowerShell connected successfully"

      - name: Pre-deployment — Prod
        shell: pwsh
        run: |
          ./ADF/release/PrePostDeploymentScript.ps1 `
            -ArmTemplate          "./ADF/ArmTemplates/Prod/ARMTemplateForFactory.json" `
            -ArmTemplateParameters "./ADF/ArmTemplates/Prod/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -ResourceGroupName    "${{ env.ADF_RG }}" `
            -DataFactoryName      "${{ env.ADF_NAME }}" `
            -PreDeployment        $true `
            -DeleteDeployment     $true

      - name: Update global parameters — Prod
        shell: pwsh
        run: |
          ./ADF/release/GlobalParametersUpdateScript.ps1 `
            -globalParametersFilePath "./ADF/ArmTemplates/Prod/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -resourceGroupName        "${{ env.ADF_RG }}" `
            -dataFactoryName          "${{ env.ADF_NAME }}"

      - name: ARM template deployment — Prod
        uses: azure/arm-deploy@v2
        with:
          subscriptionId:    ${{ vars.ARM_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.ADF_RG }}
          region:            ${{ env.REGION }}
          template:          ./ADF/ArmTemplates/Prod/ARMTemplateForFactory.json
          parameters:        ./ADF/ArmTemplates/Prod/ARMTemplateParametersForFactory.json

      - name: Post-deployment — Prod
        shell: pwsh
        run: |
          ./ADF/release/PrePostDeploymentScript.ps1 `
            -ArmTemplate          "./ADF/ArmTemplates/Prod/ARMTemplateForFactory.json" `
            -ArmTemplateParameters "./ADF/ArmTemplates/Prod/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -ResourceGroupName    "${{ env.ADF_RG }}" `
            -DataFactoryName      "${{ env.ADF_NAME }}" `
            -PreDeployment        $false `
            -DeleteDeployment     $false

      - name: Create Action Group and Alerts — Prod
        shell: pwsh
        run: |
          ./ADF/release/CreateActionGroupAndAlerts.ps1 `
            -ResourceGroupName      "${{ env.ADF_RG }}" `
            -DataFactoryName        "${{ env.ADF_NAME }}" `
            -ShortName              "AG_Main" `
            -Emails                 "${{ env.NOTIFICATION_DL }}" `
            -EmailUserNames         "${{ env.ASSIGNEE }}" `
            -ActionGroupLocation    "global" `
            -AlertDescription       "Pipeline failures for Data Factory ${{ env.ADF_NAME }}" `
            -AlertSeverity          2 `
            -TargetResourceRegion   "${{ env.ADF_RG }}" `
            -PipelineNameFilter     "*main*" `
            -FailureTypes           "UserError","SystemError","BadGateway" `
            -MetricName             "PipelineFailedRuns" `
            -MetricNamespace        "Microsoft.DataFactory/factories" `
            -TimeAggregation        "Total" `
            -Operator               "GreaterThan" `
            -Threshold              0 `
            -WindowSize             "01:00:00" `
            -Frequency              "01:00:00"

      - name: Comment on PR — success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ ADF ARM template deployed successfully to **production**.'
            })

      - name: Comment on PR — failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ ADF deployment to **production** failed. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })