name: Terraform Apply

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - test
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tpl'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply (${{ github.base_ref == 'main' && 'prod' || github.base_ref }})
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    environment: ${{ github.base_ref == 'main' && 'prod' || github.base_ref == 'test' && 'test' || 'dev' }}

    env:
      ARM_CLIENT_ID:             ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:         ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID:       ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:             ${{ secrets.ARM_TENANT_ID }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}
      TF_ENV:     ${{ github.base_ref == 'main' && 'prod' || github.base_ref == 'test' && 'test' || 'dev' }}
      TF_BACKEND: ${{ vars.TF_DEFAULT_BACKEND != '' && vars.TF_DEFAULT_BACKEND || 'cloud' }}

    steps:
      - name: Check backend
        run: |
          if [[ "$TF_BACKEND" != "local" ]]; then
            echo "Backend is '$TF_BACKEND' — apply is managed by Terraform Cloud, skipping."
            exit 0
          fi
          echo "Backend is local — proceeding with apply"

      - name: Checkout code
        if: env.TF_BACKEND == 'local'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        if: env.TF_BACKEND == 'local'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.9.0' }}

      - name: Select providers file
        if: env.TF_BACKEND == 'local'
        working-directory: build/artifacts
        run: |
          cp providers_local.tf.tpl providers.tf
          echo "providers.tf generated"

      - name: Generate tfvars
        if: env.TF_BACKEND == 'local'
        working-directory: build/artifacts
        run: |
          cat > ci.auto.tfvars << EOF
          ARM_SUBSCRIPTION_ID = "${{ vars.ARM_SUBSCRIPTION_ID }}"
          ARM_TENANT_ID       = "${{ secrets.ARM_TENANT_ID }}"
          ARM_CLIENT_ID       = "${{ secrets.ARM_CLIENT_ID }}"
          ARM_CLIENT_SECRET   = "${{ secrets.ARM_CLIENT_SECRET }}"
          EOF

      - name: Terraform Init
        if: env.TF_BACKEND == 'local'
        working-directory: build/artifacts
        run: terraform init

      - name: Terraform Apply
        if: env.TF_BACKEND == 'local'
        working-directory: build/artifacts
        run: |
          echo "Applying for environment: $TF_ENV..."
          terraform apply -input=false -auto-approve

      - name: Cleanup generated files
        if: env.TF_BACKEND == 'local' && always()
        run: |
          rm -f build/artifacts/providers.tf
          rm -f build/artifacts/ci.auto.tfvars

      - name: Comment on PR
        if: env.TF_BACKEND == 'local' && success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Terraform apply completed successfully for environment **${{ env.TF_ENV }}**.`
            })