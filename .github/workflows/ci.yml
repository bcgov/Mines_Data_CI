name: Terraform Quality Checks

on:
  pull_request:
    branches:
      - dev
      - test
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tpl'
      - '.github/workflows/ci.yml'

permissions:
  contents: write
  pull-requests: write

# Prevent concurrent runs on the same branch to avoid state/doc commit races
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Validate branch merge rules
  # ─────────────────────────────────────────────────────────────────────────────
  validate-branch-strategy:
    name: Validate Branch Strategy
    runs-on: ubuntu-latest

    steps:
      - name: Check branch merge rules
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"

          INVALID_PAIRS=("dev:test" "dev:main" "test:main" "test:dev" "main:test" "main:dev")
          PAIR="$SOURCE:$TARGET"

          for invalid in "${INVALID_PAIRS[@]}"; do
            if [[ "$PAIR" == "$invalid" ]]; then
              echo "ERROR: Cannot merge '$SOURCE' into '$TARGET'. Each environment is independent."
              exit 1
            fi
          done

          declare -A ENV_TARGETS=(["-dev"]="dev" ["-test"]="test" ["-prod"]="main")
          for suffix in "${!ENV_TARGETS[@]}"; do
            expected="${ENV_TARGETS[$suffix]}"
            if [[ "$SOURCE" =~ $suffix$ && "$TARGET" != "$expected" ]]; then
              echo "ERROR: Branch '$SOURCE' (suffix '$suffix') must target '$expected', not '$TARGET'"
              exit 1
            fi
          done

          echo "Branch strategy validation passed"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Resolve environment and backend
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-environment:
    name: Resolve Environment
    runs-on: ubuntu-latest
    needs: [validate-branch-strategy]
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      backend:  ${{ steps.set-backend.outputs.backend }}

    steps:
      - name: Set environment name
        id: set-env
        run: |
          BRANCH="${{ github.base_ref }}"

          case "$BRANCH" in
            main) echo "env_name=prod" >> $GITHUB_OUTPUT ;;
            test) echo "env_name=test" >> $GITHUB_OUTPUT ;;
            *)    echo "env_name=dev"  >> $GITHUB_OUTPUT ;;
          esac

      - name: Set backend
        id: set-backend
        run: |
          BACKEND="${{ vars.TF_DEFAULT_BACKEND }}"
          echo "backend=${BACKEND:-cloud}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Terraform quality checks
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-quality:
    name: Terraform Quality Checks (${{ needs.resolve-environment.outputs.env_name }} / ${{ needs.resolve-environment.outputs.backend }})
    runs-on: ubuntu-latest
    needs: [resolve-environment]
    environment: ${{ needs.resolve-environment.outputs.env_name }}

    env:
      ARM_CLIENT_ID:             ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:         ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID:       ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:             ${{ secrets.ARM_TENANT_ID }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}
      TF_ENV:     ${{ needs.resolve-environment.outputs.env_name }}
      TF_BACKEND: ${{ needs.resolve-environment.outputs.backend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Set TF_VERSION repo variable to override, falls back to 1.9.0
          terraform_version: ${{ vars.TF_VERSION || '1.9.0' }}

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Install terraform-docs
        run: |
          VERSION="v0.17.0"
          wget -q -P /tmp "https://github.com/terraform-docs/terraform-docs/releases/download/${VERSION}/terraform-docs-${VERSION}-linux-amd64.tar.gz"
          tar -xzf "/tmp/terraform-docs-${VERSION}-linux-amd64.tar.gz" -C /tmp
          chmod +x /tmp/terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/
          terraform-docs --version

      # ── Provider setup ────────────────────────────────────────────────────────

      - name: Select providers file
        working-directory: build/artifacts
        run: |
          if [[ "$TF_BACKEND" == "cloud" ]]; then
            echo "Using Terraform Cloud backend..."
            cp providers_cloud.tf.tpl providers.tf
          else
            echo "Using local backend..."
            cp providers_local.tf.tpl providers.tf
          fi
          # Format immediately after copy to prevent fmt failures
          terraform fmt providers.tf
          echo "providers.tf generated and formatted from $TF_BACKEND template"

      # ── Static analysis ───────────────────────────────────────────────────────

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Check for format changes
        id: fmt-changed
        run: |
          git add '**.tf'
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Formatting is up to date"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Formatting changes detected"
          fi

      - name: Commit and push format changes
        if: steps.fmt-changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "fmt: auto-format Terraform files [skip ci]"
          git push

      - name: Comment on PR (format)
        if: steps.fmt-changed.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Terraform files have been automatically formatted.'
            })

      - name: TFLint
        run: |
          tflint --init
          tflint --format compact --recursive --minimum-failure-severity=error

      # ── Init & validate ───────────────────────────────────────────────────────

      - name: Terraform Init (artifacts)
        working-directory: build/artifacts
        run: |
          echo "Initialising Terraform (artifacts) with $TF_BACKEND backend..."
          terraform init

      - name: Terraform Init (modules)
        working-directory: build/modules
        run: terraform init -backend=false

      - name: Terraform Validate (artifacts)
        working-directory: build/artifacts
        run: terraform validate

      - name: Terraform Validate (modules)
        working-directory: build/modules
        run: terraform validate

      # ── Plan ──────────────────────────────────────────────────────────────────

      - name: Terraform Plan
        working-directory: build/artifacts
        env:
          TF_VAR_ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          TF_VAR_ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
          TF_VAR_ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
          TF_VAR_ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
          TF_VAR_ENVIRONMENT:         ${{ env.TF_ENV }}
        run: |
          echo "Planning for environment: $TF_ENV..."
          terraform plan -input=false

      # ── Documentation ─────────────────────────────────────────────────────────

      - name: Generate Terraform documentation
        run: |
          echo "Generating Terraform documentation..."
          while IFS= read -r dir; do
            echo "Processing $dir..."
            terraform-docs markdown table --output-file README.md --output-mode inject "$dir"
          done < <(
            find . -type f -name "*.tf" \
              ! -path "*/.terraform/*" \
              -exec dirname {} \; \
              | sort -u \
              | xargs -I{} sh -c '[ -f "{}/main.tf" ] || [ -f "{}/versions.tf" ] && echo "{}"'
          )

      - name: Check for documentation changes
        id: docs-changed
        run: |
          # Only stage markdown files — avoids accidentally staging generated/temp files
          git add '**.md'
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Documentation is up to date"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Documentation updates detected"
          fi

      - name: Commit and push documentation changes
        if: steps.docs-changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "docs: auto-update Terraform documentation [skip ci]"
          git push

      - name: Comment on PR (docs)
        if: steps.docs-changed.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Terraform documentation has been automatically updated.'
            })

      # ── Cleanup ───────────────────────────────────────────────────────────────

      - name: Cleanup generated files
        if: always()
        run: |
          rm -f build/artifacts/providers.tf
          echo "Cleaned up generated files"

      # ── Summary ───────────────────────────────────────────────────────────────

      - name: Quality Checks Summary
        if: success()
        run: |
          echo "All Terraform quality checks passed"
          echo "Environment : $TF_ENV"
          echo "Backend     : $TF_BACKEND"