name: Terraform Quality Checks

on:
  pull_request:
    branches:
      - dev
      - test
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tpl'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - dev
      - test
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tpl'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Terraform backend to use (defaults to TF_DEFAULT_BACKEND repo variable)'
        required: true
        default: 'cloud'
        type: choice
        options:
          - local
          - cloud
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: write
  pull-requests: write

# Prevent concurrent runs on the same branch to avoid state/doc commit races
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Validate branch merge rules (PR only)
  # ─────────────────────────────────────────────
  validate-branch-strategy:
    name: Validate Branch Strategy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch merge rules
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"

          # Block direct environment-to-environment merges
          INVALID_PAIRS=("dev:test" "dev:main" "test:main" "test:dev" "main:test" "main:dev")
          PAIR="$SOURCE:$TARGET"

          for invalid in "${INVALID_PAIRS[@]}"; do
            if [[ "$PAIR" == "$invalid" ]]; then
              echo "❌ ERROR: Cannot merge '$SOURCE' into '$TARGET'"
              echo "Each environment is independent. Create a new feature branch from the target."
              exit 1
            fi
          done

          # Block feature branches targeting the wrong environment
          declare -A ENV_TARGETS=(["-dev"]="dev" ["-test"]="test" ["-prod"]="main")
          for suffix in "${!ENV_TARGETS[@]}"; do
            expected="${ENV_TARGETS[$suffix]}"
            if [[ "$SOURCE" =~ $suffix$ && "$TARGET" != "$expected" ]]; then
              echo "❌ ERROR: Feature branch '$SOURCE' (suffix '$suffix') must target '$expected', not '$TARGET'"
              exit 1
            fi
          done

          echo "✅ Branch strategy validation passed"

  # ─────────────────────────────────────────────
  # JOB 2: Resolve environment, backend, action
  # ─────────────────────────────────────────────
  resolve-environment:
    name: Resolve Environment
    runs-on: ubuntu-latest
    needs: [validate-branch-strategy]
    # Run if branch validation passed, or if it was skipped (push / workflow_dispatch)
    if: |
      always() && (
        needs.validate-branch-strategy.result == 'success' ||
        needs.validate-branch-strategy.result == 'skipped'
      )
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      backend:  ${{ steps.set-backend.outputs.backend }}
      action:   ${{ steps.set-action.outputs.action }}

    steps:
      - name: Set environment name
        id: set-env
        run: |
          # For PRs use the target branch; otherwise use the branch being pushed to
          BRANCH="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"

          case "$BRANCH" in
            main) echo "env_name=prod" >> $GITHUB_OUTPUT ;;
            test) echo "env_name=test" >> $GITHUB_OUTPUT ;;
            *)    echo "env_name=dev"  >> $GITHUB_OUTPUT ;;
          esac

      - name: Set backend
        id: set-backend
        run: |
          # Manual trigger: use the UI selection; all other triggers: use the repo variable
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=${{ github.event.inputs.backend }}" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ vars.TF_DEFAULT_BACKEND }}" >> $GITHUB_OUTPUT
          fi

      - name: Set action
        id: set-action
        run: |
          # Apply only when explicitly selected via workflow_dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.action }}" == "apply" ]]; then
            echo "action=apply" >> $GITHUB_OUTPUT
          else
            echo "action=plan" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # JOB 3: Terraform quality checks
  # ─────────────────────────────────────────────
  terraform-quality:
    name: Terraform Quality Checks (${{ needs.resolve-environment.outputs.env_name }} / ${{ needs.resolve-environment.outputs.backend }} / ${{ needs.resolve-environment.outputs.action }})
    runs-on: ubuntu-latest
    needs: [resolve-environment]
    environment: ${{ needs.resolve-environment.outputs.env_name }}

    env:
      # ARM provider authentication — these must be ARM_* not TF_VAR_ARM_* for the azurerm provider
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      # Convenience shorthand used throughout steps
      TF_ENV: ${{ needs.resolve-environment.outputs.env_name }}
      TF_BACKEND: ${{ needs.resolve-environment.outputs.backend }}
      TF_ACTION: ${{ needs.resolve-environment.outputs.action }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On PRs check out the head so fmt/docs commits go to the right branch
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION || '1.9.0' }}

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Install terraform-docs
        run: |
          VERSION="v0.17.0"
          wget -q "https://github.com/terraform-docs/terraform-docs/releases/download/${VERSION}/terraform-docs-${VERSION}-linux-amd64.tar.gz"
          tar -xzf "terraform-docs-${VERSION}-linux-amd64.tar.gz"
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          terraform-docs --version

      # ── Provider setup ──────────────────────────────────────────────────────

      - name: Select providers file
        working-directory: build/artifacts
        run: |
          if [[ "$TF_BACKEND" == "cloud" ]]; then
            echo "Using Terraform Cloud backend..."
            cp providers_cloud.tf.tpl providers.tf
          else
            echo "Using local backend..."
            cp providers_local.tf.tpl providers.tf
          fi
          echo "✅ providers.tf generated from $TF_BACKEND template"

      # ── Static analysis ─────────────────────────────────────────────────────

      - name: Terraform Format Check
        run: |
          echo "Running terraform fmt check..."
          terraform fmt -check -recursive

      - name: TFLint
        run: |
          echo "Running tflint..."
          tflint --init
          tflint --format compact --recursive --minimum-failure-severity=error

      # ── Init & validate ─────────────────────────────────────────────────────

      - name: Terraform Init (artifacts)
        working-directory: build/artifacts
        run: |
          echo "Initialising Terraform (artifacts) with $TF_BACKEND backend..."
          terraform init

      - name: Terraform Init (modules)
        working-directory: build/modules
        run: terraform init -backend=false

      - name: Terraform Validate (artifacts)
        working-directory: build/artifacts
        run: terraform validate

      - name: Terraform Validate (modules)
        working-directory: build/modules
        run: terraform validate

      # ── Plan & apply ────────────────────────────────────────────────────────

      - name: Terraform Plan
        working-directory: build/artifacts
        run: |
          echo "Planning for environment: $TF_ENV..."
          terraform plan \
            -var-file="environments/$TF_ENV.tfvars" \
            -out=tfplan \
            -input=false

      - name: Terraform Apply
        if: env.TF_ACTION == 'apply'
        working-directory: build/artifacts
        run: |
          echo "🚀 Applying Terraform changes for environment: $TF_ENV..."
          terraform apply -input=false tfplan

      - name: Commit and push state file
        if: env.TF_ACTION == 'apply'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add build/artifacts/terraform.tfstate build/artifacts/terraform.tfstate.backup
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update terraform state [$TF_ENV] [skip ci]"
            git push
          fi

      # ── Documentation ────────────────────────────────────────────────────────

      - name: Generate Terraform documentation
        run: |
          echo "Generating Terraform documentation..."
          while IFS= read -r dir; do
            echo "Processing $dir..."
            terraform-docs markdown table --output-file README.md --output-mode inject "$dir"
          done < <(
            find . -type f -name "*.tf" \
              ! -path "*/.terraform/*" \
              -exec dirname {} \; \
              | sort -u \
              | xargs -I{} sh -c '[ -f "{}/main.tf" ] || [ -f "{}/versions.tf" ] && echo "{}"'
          )

      - name: Check for documentation changes
        id: docs-changed
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Documentation is up to date"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Documentation updates detected"
          fi

      - name: Commit and push documentation changes
        if: steps.docs-changed.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "docs: auto-update Terraform documentation [skip ci]"
          git push

      - name: Comment on PR
        if: steps.docs-changed.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📝 Terraform documentation has been automatically updated.'
            })

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Cleanup generated providers.tf
        if: always()
        run: rm -f build/artifacts/providers.tf && echo "✅ Cleaned up providers.tf"

      # ── Summary ──────────────────────────────────────────────────────────────

      - name: Quality Checks Summary
        if: success()
        run: |
          echo "✅ All Terraform quality checks passed"
          echo "Environment : $TF_ENV"
          echo "Backend     : $TF_BACKEND"
          echo "Action      : $TF_ACTION"