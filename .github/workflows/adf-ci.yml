name: ADF CI — Export & Validate ARM Templates

on:
  push:
    branches:
      - "adf_publish"
      - "main"
      - "dev"
    paths:
      - "ADF/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "dev"
      - "test"
      - "main"
    paths:
      - "ADF/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: adf-ci-${{ github.ref }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Required repository variables (Settings → Variables → Actions):
#   ARM_SUBSCRIPTION_ID    Azure subscription ID
#   ARM_TENANT_ID          Azure AD tenant ID
#   ARM_CLIENT_ID          Service principal client ID
#
# Required repository secrets (Settings → Secrets → Actions):
#   ARM_CLIENT_SECRET      Service principal client secret
#
# Hardcoded resource config (edit here to change environments):
#   Resource group : mines-fabric-rg02
#   Data factory   : mines-fabric-adf01
#   Region         : canadacentral
# ─────────────────────────────────────────────────────────────────────────────
env:
  REGION:          "canadacentral"
  NOTIFICATION_DL: "sebastian.hansen@gov.bc.ca"
  ASSIGNEE:        "Sebastian Hansen"
  # ADF resource config — hardcoded, no repo variable needed
  ADF_RG:          "mines-fabric-rg02"
  ADF_NAME:        "mines-fabric-adf01"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Export & Validate ARM Templates
  # ═══════════════════════════════════════════════════════════════════════════
  export-arm-templates:
    name: "1. Export & Validate ARM Templates"
    runs-on: ubuntu-latest
    environment: dev
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show changed ADF objects
        run: git diff --name-status HEAD^ HEAD -- ADF/ || true

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install ADF utilities
        working-directory: ADF
        run: npm install

      # ── Download validator bundle ─────────────────────────────────────────

      - name: Download ADF validator bundle
        working-directory: ADF
        run: |
          mkdir -p downloads
          curl -sSL "https://adf.azure.com/assets/cmd-api/main.js" -o downloads/main.js
          echo "Bundle downloaded: $(wc -c < downloads/main.js) bytes"

      # ── Validate Dev ARM template ─────────────────────────────────────────
      # Per GitHub docs, vars.* must be mapped into a step env: block and
      # then read as a shell variable — not interpolated inline in run:.
      # Reference: https://docs.github.com/en/actions/writing-workflows/
      #            choosing-what-your-workflow-does/store-variables

      - name: Validate ADF code
        working-directory: ADF
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          echo "Subscription : $ARM_SUBSCRIPTION_ID"
          echo "Resource group: $ADF_RG"
          echo "Factory name  : $ADF_NAME"
          FACTORY_ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${ADF_RG}/providers/Microsoft.DataFactory/factories/${ADF_NAME}"
          echo "Factory ID : $FACTORY_ID"
          if [[ -z "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "ERROR: ARM_SUBSCRIPTION_ID is not set in Settings → Variables → Actions."
            exit 1
          fi
          npm run build validate ./code "$FACTORY_ID" ./ArmTemplates/Dev

      # ── Export Dev ARM template ───────────────────────────────────────────

      - name: Export Dev ARM template
        working-directory: ADF
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          FACTORY_ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${ADF_RG}/providers/Microsoft.DataFactory/factories/${ADF_NAME}"
          echo "Exporting ARM template for Dev..."
          npm run build export ./code "$FACTORY_ID" ./ArmTemplates/Dev

      # ── Generate Test ARM template ────────────────────────────────────────

      - name: Generate Test ARM template
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          echo "Creating Test ARM templates from Dev..."
          rm -rf ./ADF/ArmTemplates/Test
          mkdir -p ./ADF/ArmTemplates/Test
          cp -r ./ADF/ArmTemplates/Dev/* ./ADF/ArmTemplates/Test/
          for file in ./ADF/ArmTemplates/Test/*; do
            [[ -f "$file" ]] || continue
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase="${base//$ADF_NAME/$ADF_NAME}"
            newfile="$dir/$newbase"
            [[ "$file" != "$newfile" ]] && mv "$file" "$newfile" && echo "Renamed → $newbase"
            sed -i \
              -e "s|$ADF_NAME|$ADF_NAME|g" \
              -e "s|$ARM_SUBSCRIPTION_ID|$ARM_SUBSCRIPTION_ID|g" \
              -e "s|$ADF_RG|$ADF_RG|g" \
              "$newfile"
            echo "Updated content in $newfile"
          done

      # ── Generate Prod ARM template ────────────────────────────────────────

      - name: Generate Prod ARM template
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          echo "Creating Prod ARM templates from Dev..."
          rm -rf ./ADF/ArmTemplates/Prod
          mkdir -p ./ADF/ArmTemplates/Prod
          cp -r ./ADF/ArmTemplates/Dev/* ./ADF/ArmTemplates/Prod/
          for file in ./ADF/ArmTemplates/Prod/*; do
            [[ -f "$file" ]] || continue
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase="${base//$ADF_NAME/$ADF_NAME}"
            newfile="$dir/$newbase"
            [[ "$file" != "$newfile" ]] && mv "$file" "$newfile" && echo "Renamed → $newbase"
            sed -i \
              -e "s|$ADF_NAME|$ADF_NAME|g" \
              -e "s|$ARM_SUBSCRIPTION_ID|$ARM_SUBSCRIPTION_ID|g" \
              -e "s|$ADF_RG|$ADF_RG|g" \
              "$newfile"
            echo "Updated content in $newfile"
          done

      # ── Merge global parameters ───────────────────────────────────────────

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ vars.ARM_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.ARM_CLIENT_SECRET }}",
              "tenantId":       "${{ vars.ARM_TENANT_ID }}",
              "subscriptionId": "${{ vars.ARM_SUBSCRIPTION_ID }}"
            }

      - name: Merge global parameters — Dev
        shell: pwsh
        run: |
          ./ADF/release/MergeGlobalParameters.ps1 `
            -GeneratedFilePath "./ADF/ArmTemplates/Dev/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -OverwriteFilePath "./ADF/GlobalParamsOverwrite/GlobalParamsDev.json"

      - name: Merge global parameters — Test
        shell: pwsh
        run: |
          ./ADF/release/MergeGlobalParameters.ps1 `
            -GeneratedFilePath "./ADF/ArmTemplates/Test/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -OverwriteFilePath "./ADF/GlobalParamsOverwrite/GlobalParamsTest.json"

      - name: Merge global parameters — Prod
        shell: pwsh
        run: |
          ./ADF/release/MergeGlobalParameters.ps1 `
            -GeneratedFilePath "./ADF/ArmTemplates/Prod/${{ env.ADF_NAME }}_GlobalParameters.json" `
            -OverwriteFilePath "./ADF/GlobalParamsOverwrite/GlobalParamsProd.json"

      # ── Upload & commit ───────────────────────────────────────────────────

      - name: Upload ARM templates artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmTemplates
          path: ./ADF/ArmTemplates/
          retention-days: 7

      - name: Commit and push ARM templates
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add ./ADF/ArmTemplates/
          if git diff --staged --quiet; then
            echo "No ARM template changes to commit."
          else
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git commit -m "chore: auto-export ARM templates [skip ci]"
            git push
            echo "ARM templates committed and pushed."
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — PR quality gate
  # ═══════════════════════════════════════════════════════════════════════════
  validate-branch-strategy:
    name: "2. Validate Branch Strategy"
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch merge rules
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"
          echo "Source: $SOURCE → Target: $TARGET"

          INVALID_PAIRS=("dev:test" "dev:main" "test:main" "test:dev" "main:test" "main:dev")
          PAIR="$SOURCE:$TARGET"
          for invalid in "${INVALID_PAIRS[@]}"; do
            if [[ "$PAIR" == "$invalid" ]]; then
              echo "ERROR: Cannot merge '$SOURCE' into '$TARGET'. Each environment deploys independently."
              exit 1
            fi
          done

          declare -A ENV_TARGETS=(["-dev"]="dev" ["-test"]="test" ["-prod"]="main")
          for suffix in "${!ENV_TARGETS[@]}"; do
            expected="${ENV_TARGETS[$suffix]}"
            if [[ "$SOURCE" =~ $suffix$ && "$TARGET" != "$expected" ]]; then
              echo "ERROR: Branch '$SOURCE' (suffix '$suffix') must target '$expected', not '$TARGET'."
              exit 1
            fi
          done

          echo "Branch strategy validation passed."